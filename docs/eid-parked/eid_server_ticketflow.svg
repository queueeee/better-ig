<svg width="100%" viewBox="0 0 720 620" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
<title>Registrierung mit passkey-gebundenem Ticket</title>
<desc>Fünfstufiger Registrierungsablauf über zwei getrennte Trust-Domänen. Der Client bindet seinen Passkey kryptografisch in eine geblendete Nonce; Domäne A prüft das Ausweis-Pseudonym und signiert blind; Domäne B löst das Ticket gegen einen WebAuthn-Besitznachweis ein. Keine Seite sieht beide Hälften.</desc>

<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="30" y="38" font-size="15" font-weight="600" fill="#3C3B38">Registrierung: das Ticket gehört dem Passkey, nicht dem Besitzer der Datei</text>
<text x="30" y="58" font-size="12" fill="#6B6963">Zwei getrennte Domänen, verbunden nur durch ein blind signiertes Einweg-Ticket</text>

<!-- Schritt 1 -->
<rect x="30" y="80" width="104" height="66" rx="8" fill="#E7F4EE" stroke="#14805E" stroke-width="0.75"/>
<text x="82" y="107" text-anchor="middle" font-size="12" font-weight="600" fill="#0B5C44">Client</text>
<text x="82" y="125" text-anchor="middle" font-size="11" fill="#14805E">auf dem Gerät</text>
<rect x="146" y="80" width="544" height="66" rx="8" fill="#FFFFFF" stroke="#9BB8AC" stroke-width="0.75"/>
<text x="164" y="105" font-size="13" font-weight="600" fill="#3C3B38">① Passkey erzeugen, Nonce mit H(Passkey) darin blenden</text>
<text x="164" y="127" font-size="12" fill="#6B6963">Der Passkey wird zum einzigen Schlüssel für den späteren Account — noch bevor es ihn gibt.</text>

<line x1="360" y1="146" x2="360" y2="166" stroke="#89877F" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Schritt 2 -->
<rect x="30" y="170" width="104" height="66" rx="8" fill="#ECEBFB" stroke="#5B51C9" stroke-width="0.75"/>
<text x="82" y="197" text-anchor="middle" font-size="12" font-weight="600" fill="#423A9E">Domäne A</text>
<text x="82" y="215" text-anchor="middle" font-size="11" fill="#5B51C9">Identität</text>
<rect x="146" y="170" width="544" height="66" rx="8" fill="#FFFFFF" stroke="#A5A1CE" stroke-width="0.75"/>
<text x="164" y="195" font-size="13" font-weight="600" fill="#3C3B38">② eID- oder Pass-Session: Pseudonym prüfen und als Keyed Hash ablegen</text>
<text x="164" y="217" font-size="12" fill="#6B6963">A sieht das Pseudonym, aber nie die Nonce — sie ist geblendet. HSM-Schlüssel liegt getrennt.</text>

<line x1="360" y1="236" x2="360" y2="256" stroke="#89877F" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Schritt 3 -->
<rect x="30" y="260" width="104" height="66" rx="8" fill="#ECEBFB" stroke="#5B51C9" stroke-width="0.75"/>
<text x="82" y="287" text-anchor="middle" font-size="12" font-weight="600" fill="#423A9E">Domäne A</text>
<text x="82" y="305" text-anchor="middle" font-size="11" fill="#5B51C9">Identität</text>
<rect x="146" y="260" width="544" height="66" rx="8" fill="#FFFFFF" stroke="#A5A1CE" stroke-width="0.75"/>
<text x="164" y="285" font-size="13" font-weight="600" fill="#3C3B38">③ Blind signieren, HSM-Signaturzähler +1</text>
<text x="164" y="307" font-size="12" fill="#6B6963">Der Zähler muss zur Zeilenzahl der Registry passen — sonst wurde der Schlüssel missbraucht.</text>

<line x1="360" y1="326" x2="360" y2="346" stroke="#89877F" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Schritt 4 -->
<rect x="30" y="350" width="104" height="66" rx="8" fill="#E7F4EE" stroke="#14805E" stroke-width="0.75"/>
<text x="82" y="377" text-anchor="middle" font-size="12" font-weight="600" fill="#0B5C44">Client</text>
<text x="82" y="395" text-anchor="middle" font-size="11" fill="#14805E">auf dem Gerät</text>
<rect x="146" y="350" width="544" height="66" rx="8" fill="#FFFFFF" stroke="#9BB8AC" stroke-width="0.75"/>
<text x="164" y="375" font-size="13" font-weight="600" fill="#3C3B38">④ Entblenden, warten, frische Verbindung aufbauen</text>
<text x="164" y="397" font-size="12" fill="#6B6963">Gestohlene Ticket-Datei ist wertlos: ohne den privaten Passkey nicht einlösbar.</text>

<line x1="360" y1="416" x2="360" y2="436" stroke="#89877F" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Schritt 5 -->
<rect x="30" y="440" width="104" height="66" rx="8" fill="#EAF2FA" stroke="#2F6FA8" stroke-width="0.75"/>
<text x="82" y="467" text-anchor="middle" font-size="12" font-weight="600" fill="#1F4E78">Domäne B</text>
<text x="82" y="485" text-anchor="middle" font-size="11" fill="#2F6FA8">Produkt</text>
<rect x="146" y="440" width="544" height="66" rx="8" fill="#FFFFFF" stroke="#9DB6CE" stroke-width="0.75"/>
<text x="164" y="465" font-size="13" font-weight="600" fill="#3C3B38">⑤ Ticket + WebAuthn-Besitznachweis prüfen, Account anlegen</text>
<text x="164" y="487" font-size="12" fill="#6B6963">B sieht das Ticket und den Passkey — das Pseudonym nie. Handle sofort reservieren.</text>

<!-- Fazit -->
<rect x="30" y="530" width="660" height="66" rx="8" fill="#F1EFE8" stroke="#B9B7AE" stroke-width="0.75"/>
<text x="360" y="555" text-anchor="middle" font-size="12.5" font-weight="600" fill="#55534E">Keine gemeinsame Kennung, keine gemeinsamen Logs, keine gemeinsame Hardware.</text>
<text x="360" y="577" text-anchor="middle" font-size="12" fill="#6B6963">Die einzige Brücke ist ein Ticket, das nur einlösen kann, wer den Passkey besitzt.</text>
</svg>
