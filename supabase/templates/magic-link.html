<!--
  Vorlage für "Magic Link" in Supabase.
  Einzufügen unter: Authentication → Email Templates → Magic Link

  Entscheidend ist {{ .Token }} — das ist der sechsstellige Code. Ohne diese
  Variable verschickt Supabase nur einen Link, und die Anmeldung in der App
  läuft ins Leere, weil sie einen Code erwartet.

  Diese Datei liegt im Repo, weil Dashboard-Vorlagen sonst nirgends
  versioniert sind und bei einem neuen Projekt verloren gehen.

  Inline-Styles sind Absicht: E-Mail-Clients ignorieren <style>-Blöcke
  weitgehend, und externe Ressourcen werden ohnehin blockiert.
-->
<div style="margin:0;padding:32px 16px;background:#f1efec;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <div style="max-width:420px;margin:0 auto;background:#fbfaf8;border:1px solid #e4e2de;border-radius:12px;padding:32px;">

    <p style="margin:0;font-size:12px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#2f5d50;">
      Bilder
    </p>

    <h1 style="margin:12px 0 0;font-size:24px;line-height:1.25;font-weight:600;color:#16181d;">
      Dein Anmeldecode
    </h1>

    <p style="margin:12px 0 0;font-size:15px;line-height:1.6;color:#6e7076;">
      Gib diesen Code in der App ein, um dich anzumelden.
    </p>

    <p style="margin:24px 0;padding:16px;background:#f1efec;border-radius:8px;text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:30px;font-weight:600;letter-spacing:0.28em;color:#16181d;">
      {{ .Token }}
    </p>

    <p style="margin:0;font-size:14px;line-height:1.6;color:#6e7076;">
      Der Code gilt eine Stunde und lässt sich nur einmal verwenden.
    </p>

    <p style="margin:24px 0 0;padding-top:20px;border-top:1px solid #e4e2de;font-size:13px;line-height:1.6;color:#6e7076;">
      Du hast keine Anmeldung angefordert? Dann ignorier diese Nachricht — ohne
      den Code passiert nichts.
    </p>

  </div>
</div>
